<!DOCTYPE html>
<html>
<head>
    <title>Colorado Hunting Map - Pro Insights</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        
        .map-title, .leaflet-control-layers, .legend-widget, .custom-control {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-family: 'Segoe UI', sans-serif;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .map-title {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            padding: 15px; min-width: 250px;
        }

        .leaflet-control-layers-expanded {
            background: #2c3e50 !important;
            color: white !important;
            font-weight: 600;
            padding: 12px !important;
        }

        .locate-control {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 28px; font-weight: bold;
            color: #2c3e50; transition: all 0.2s;
        }
        .locate-control:hover { background: #f4f4f4; color: #3498db; }

        .filter-group { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
        .search-row { display: flex; gap: 5px; }
        input, select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-family: inherit; }
        input { flex-grow: 1; }
        
        button { padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #search-btn { background: #e67e22; color: white; }
        #search-btn:hover { background: #d35400; transform: translateY(-1px); }

        .download-box { margin-top: 15px; padding-top: 10px; border-top: 1px solid #eee; }
        .download-link {
            display: flex; align-items: center; justify-content: center;
            background: #27ae60; color: white; text-decoration: none;
            padding: 10px; border-radius: 4px; font-size: 0.85em;
            font-weight: bold; transition: background 0.2s;
        }
        
        .legend-widget { min-width: 180px; overflow: hidden; }
        .legend-header { background: #2c3e50; color: white; padding: 10px 15px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; }
        .legend-content { padding: 12px; font-size: 0.9em; }
        .legend-content.collapsed { display: none; }
        .legend-item { display: flex; align-items: center; margin-bottom: 6px; }
        .legend-box { width: 16px; height: 16px; margin-right: 10px; border: 1px solid rgba(0,0,0,0.2); border-radius: 3px; }
        
        .leaflet-popup-content { font-family: 'Segoe UI', sans-serif; line-height: 1.4; min-width: 200px; }
        .species-list { margin-top: 8px; padding: 5px; background: #f4f7f6; border-radius: 4px; border: 1px solid #eee; }
        
        .available { color: #27ae60; font-weight: bold; }
        .unavailable { color: #e74c3c; font-weight: bold; }

        /* MOOSE STYLING */
        .moose-popup-header { border-bottom: 2px solid #8e44ad; margin-bottom: 8px; padding-bottom: 4px; }
        .quality-excellent { color: #8e44ad; font-weight: 900; }
        .quality-high { color: #2980b9; font-weight: 900; }
        .gmu-label { background: transparent; border: none; box-shadow: none; font-weight: bold; color: #000; font-size: 11px; text-shadow: 1px 1px 2px white; pointer-events: none; }
    </style>
</head>
<body>

<div class="map-title">
    <h2 style="margin:0; color: #2c3e50; font-size: 1.4em;">Colorado Hunting Map</h2>
    <div class="filter-group">
        <label style="font-weight: bold; font-size: 0.8em; color: #7f8c8d;">SEARCH GMU:</label>
        <div class="search-row">
            <input type="text" id="gmu-search-input" placeholder="e.g. 6">
            <button id="search-btn">Go</button>
        </div>
    </div>
    <div class="filter-group">
        <select id="gmu-select"><option value="">-- Select Unit --</option></select>
    </div>
    <div class="download-box">
        <a href="docs/brochure_2026.pdf" target="_blank" class="download-link">
            <span>📄 View 2026 Brochure</span>
        </a>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' });
    var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri' });

    var map = L.map('map', { center: [39.0, -105.5], zoom: 7, layers: [osm] });

    /* CREATE PANES FOR LAYER DEPTH */
    map.createPane('countyPane'); map.getPane('countyPane').style.zIndex = 350;
    map.createPane('federalPane'); map.getPane('federalPane').style.zIndex = 425;
    map.createPane('gmuPane'); map.getPane('gmuPane').style.zIndex = 450;
    map.createPane('enrichedMoosePane'); map.getPane('enrichedMoosePane').style.zIndex = 500; 
    map.createPane('swaPane'); map.getPane('swaPane').style.zIndex = 550;
    map.createPane('labelPane'); map.getPane('labelPane').style.zIndex = 650;

    var countyLayer = L.layerGroup(); 
    var fedLayer = L.layerGroup().addTo(map);
    var gmuLayer = L.layerGroup().addTo(map);
    var swaLayer = L.layerGroup().addTo(map);
    var enrichedMooseLayer = L.layerGroup().addTo(map);

    // Moose Specific Layer Groups
    var mooseSummerLayer = L.layerGroup();
    var mooseWinterLayer = L.layerGroup();
    var mooseCorridorLayer = L.layerGroup();

    var gmuGeojson, swaGeojson, countyGeojson, fedGeojson, enrichedMooseGeojson;

    /* 1. ENRICHED MOOSE HABITAT (Hero Layer) */
    fetch('data/processed/moose_habitat_enriched.geojson').then(res => res.json()).then(data => {
        enrichedMooseGeojson = L.geoJSON(data, {
            pane: 'enrichedMoosePane',
            style: function(f) {
                var props = {};
                for (var key in f.properties) { props[key.toLowerCase()] = f.properties[key]; }
                var quality = props.habitat_quality || 'Good';
                var color = quality === 'Excellent' ? "#8e44ad" : (quality === 'High' ? "#2980b9" : "#34495e");
                return { color: color, weight: 2, fillColor: color, fillOpacity: 0.6 };
            },
            onEachFeature: function(f, l) {
                var p = {};
                for (var key in f.properties) { p[key.toLowerCase()] = f.properties[key]; }
                var unitVal = p.gmu_code || p.gmuid || p.unit_id || 'N/A';
                var dauVal = p.dau_code || p.dauid || 'CO-Moose';
                var qualityVal = p.habitat_quality || 'General';
                var qualityClass = qualityVal === 'Excellent' ? 'quality-excellent' : 'quality-high';
                l.bindPopup(`<div class="moose-popup-header"><b style="font-size: 1.1em; color: #8e44ad;">Enriched Moose Habitat</b></div><b>Unit:</b> ${unitVal}<br><b>DAU:</b> ${dauVal}<br><b>Quality:</b> <span class="${qualityClass}">${qualityVal}</span>`);
            }
        }).addTo(enrichedMooseLayer);
    });

    /* ADDING RAW MOOSE DATASETS */
    // Summer Range
    fetch('data/raw/moose/Moose_Summer_Range.geojson').then(res => res.json()).then(data => {
        L.geoJSON(data, { style: { color: "#27ae60", weight: 1, fillOpacity: 0.3 } }).addTo(mooseSummerLayer);
    });
    // Winter Range
    fetch('data/raw/moose/Moose_Winter_Range.geojson').then(res => res.json()).then(data => {
        L.geoJSON(data, { style: { color: "#2980b9", weight: 1, fillOpacity: 0.3 } }).addTo(mooseWinterLayer);
    });
    // Migration Corridors
    fetch('data/raw/moose/Moose_Migration_Corridors.geojson').then(res => res.json()).then(data => {
        L.geoJSON(data, { style: { color: "#f1c40f", weight: 3, opacity: 0.8 } }).addTo(mooseCorridorLayer);
    });

    L.control.layers({"Street View": osm, "Satellite View": satellite}, 
                     {
                        "★ Enriched Moose Habitat": enrichedMooseLayer,
                        "GMU Boundaries": gmuLayer,
                        "SWAs & Parks": swaLayer, 
                        "Federal Lands": fedLayer,
                        "County": countyLayer,
                        "Moose Summer Range": mooseSummerLayer,
                        "Moose Winter Range": mooseWinterLayer,
                        "Moose Corridors": mooseCorridorLayer
                     }, 
                     { collapsed: false }).addTo(map);

    // 2. COUNTY
    fetch('data/processed/county_co_CO.geojson').then(res => res.json()).then(data => {
        countyGeojson = L.geoJSON(data, { pane: 'countyPane', style: { color: "#e74c3c", weight: 1.5, fillOpacity: 0 },
            onEachFeature: function(f, l) {
                var name = f.properties.COUNTY || f.properties.NAME || "";
                var cleanName = name.replace(/County/gi, "").trim();
                if (l.getBounds) {
                    var center = l.getBounds().getCenter();
                    L.marker(center, { opacity: 0, interactive: false }).bindTooltip(cleanName, { permanent: true, direction: 'center', className: 'county-label', pane: 'labelPane' }).addTo(countyLayer);
                }
            }
        }).addTo(countyLayer);
    });

    // 4. FEDERAL
    function getFedStyle(agency) {
        switch (agency) {
            case 'USFS': return { color: '#27ae60', opacity: 0.4 }; 
            case 'BLM':  return { color: '#e67e22', opacity: 0.4 }; 
            case 'NPS':  return { color: '#9b59b6', opacity: 0.4 }; 
            default:     return { color: 'transparent', opacity: 0 }; 
        }
    }
    fetch('data/processed/surface_management_agency_CO.geojson').then(res => res.json()).then(data => {
        fedGeojson = L.geoJSON(data, { pane: 'federalPane', interactive: false, style: function(f) { var s = getFedStyle(f.properties.ADMIN_AGEN); return { fillColor: s.color, fillOpacity: s.opacity, weight: 0 }; } }).addTo(fedLayer);
    });

    // 5. GMU
    fetch('data/processed/CPW_GMU_Boundary_BigGame_CO.geojson').then(res => res.json()).then(data => {
        gmuGeojson = L.geoJSON(data, { pane: 'gmuPane', style: { color: "#000", weight: 1, fillOpacity: 0.05 },
            onEachFeature: function(f, l) {
                l.bindTooltip(f.properties.GMUID.toString(), { permanent: true, direction: 'center', className: 'gmu-label' });
                var props = f.properties;
                l.bindPopup(`<div class="moose-popup-header"><b>Unit ${props.GMUID}</b></div><div class="species-list">✓ Moose: ${props.MOOSEDAU}</div>`);
            }
        }).addTo(gmuLayer);
        var gmuSelect = document.getElementById('gmu-select');
        data.features.sort((a,b) => a.properties.GMUID - b.properties.GMUID).forEach(f => {
            var opt = document.createElement('option'); opt.value = f.properties.GMUID; opt.innerHTML = "Unit " + f.properties.GMUID;
            gmuSelect.appendChild(opt);
        });
        function zoomTo(id) {
            gmuGeojson.eachLayer(l => { if(l.feature.properties.GMUID.toString() === id.toString()) { map.fitBounds(l.getBounds()); l.openPopup(); } });
        }
        gmuSelect.onchange = (e) => zoomTo(e.target.value);
        document.getElementById('search-btn').onclick = () => zoomTo(document.getElementById('gmu-search-input').value);
    });

    // 6. SWA
    fetch('data/processed/CPW_State_Wildlife_Areas_And_State_Parks_CO.geojson').then(res => res.json()).then(data => {
        swaGeojson = L.geoJSON(data, { pane: 'swaPane', style: function(f) { var isPark = f.properties.PropType === "SP"; return { color: "#333", weight: 0.8, fillColor: isPark ? "#ff0000" : "#ffff00", fillOpacity: 0.7 }; },
            onEachFeature: function(f, l) { l.bindTooltip(f.properties.PropName, { className: 'land-label' }); l.bindPopup(`<b>${f.properties.PropName}</b>`); }
        }).addTo(swaLayer);
    });

    // 7. LOCATE
    var LocateControl = L.Control.extend({ options: { position: 'bottomleft' }, onAdd: function (map) { var container = L.DomUtil.create('div', 'custom-control locate-control'); container.innerHTML = '⌖'; container.onclick = function(e) { L.DomEvent.stopPropagation(e); map.locate({setView: true, maxZoom: 14}); }; return container; } });
    map.addControl(new LocateControl());

    // 8. LEGEND
    var legendWidget = L.control({position: 'bottomright'});
    legendWidget.onAdd = function() {
        var div = L.DomUtil.create('div', 'legend-widget');
        div.innerHTML = `<div class="legend-header" id="legend-toggle">Legend <span>▼</span></div><div class="legend-content" id="legend-body"></div>`;
        return div;
    };
    legendWidget.addTo(map);

    function updateLegend() {
        var body = document.getElementById('legend-body');
        var html = '';
        if (map.hasLayer(enrichedMooseLayer)) {
            html += `<b style="display:block;margin-top:5px; color:#8e44ad">Moose Insights</b>
                     <div class="legend-item"><div class="legend-box" style="background:#8e44ad"></div>Excellent Habitat</div>
                     <div class="legend-item"><div class="legend-box" style="background:#2980b9"></div>High Quality Area</div>`;
        }
        if (map.hasLayer(gmuLayer)) html += `<div class="legend-item"><div class="legend-box" style="background:rgba(0,0,0,0.1)"></div>GMU Boundaries</div>`;
        if (map.hasLayer(fedLayer)) {
            html += `<b style="display:block;margin-top:5px">Federal Agencies</b>
                     <div class="legend-item"><div class="legend-box" style="background:#27ae60"></div>US Forest Service</div>
                     <div class="legend-item"><div class="legend-box" style="background:#e67e22"></div>BLM</div>`;
        }
        
        if (map.hasLayer(mooseSummerLayer) || map.hasLayer(mooseWinterLayer) || map.hasLayer(mooseCorridorLayer)) {
            html += `<b style="display:block;margin-top:5px; border-top: 1px solid #ddd; padding-top: 5px;">Raw Moose Data</b>`;
            if (map.hasLayer(mooseSummerLayer)) html += `<div class="legend-item"><div class="legend-box" style="background:#27ae60; opacity:0.6;"></div>Summer Range</div>`;
            if (map.hasLayer(mooseWinterLayer)) html += `<div class="legend-item"><div class="legend-box" style="background:#2980b9; opacity:0.6;"></div>Winter Range</div>`;
            if (map.hasLayer(mooseCorridorLayer)) html += `<div class="legend-item"><div class="legend-box" style="background:#f1c40f; height: 3px; border:none;"></div>Migration Corridor</div>`;
        }

        body.innerHTML = html || 'No active layers';
    }

    document.getElementById('legend-toggle').onclick = function() {
        document.getElementById('legend-body').classList.toggle('collapsed');
        this.querySelector('span').innerHTML = document.getElementById('legend-body').classList.contains('collapsed') ? '▲' : '▼';
    };

    map.on('overlayadd overlayremove', updateLegend);
    updateLegend();
</script>
</body>
</html>
