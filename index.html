<!DOCTYPE html>
<html>
<head>
    <title>Colorado Hunting Map - Pro Insights</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        
        .map-title, .leaflet-control-layers, .legend-widget, .custom-control {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-family: 'Segoe UI', sans-serif;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .map-title {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            padding: 15px; min-width: 250px;
        }

        .leaflet-control-layers-expanded {
            background: #2c3e50 !important;
            color: white !important;
            font-weight: 600;
            padding: 12px !important;
        }

        .locate-control {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 28px; font-weight: bold;
            color: #2c3e50; transition: all 0.2s;
        }
        .locate-control:hover { background: #f4f4f4; color: #3498db; }

        .filter-group { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
        .search-row { display: flex; gap: 5px; }
        input, select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-family: inherit; }
        input { flex-grow: 1; }
        
        button { padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #search-btn { background: #e67e22; color: white; }
        #search-btn:hover { background: #d35400; transform: translateY(-1px); }

        .download-box { margin-top: 15px; padding-top: 10px; border-top: 1px solid #eee; }
        .download-link {
            display: flex; align-items: center; justify-content: center;
            background: #27ae60; color: white; text-decoration: none;
            padding: 10px; border-radius: 4px; font-size: 0.85em;
            font-weight: bold; transition: background 0.2s;
        }
        .download-link:hover { background: #219150; }
        
        .legend-widget { min-width: 180px; overflow: hidden; }
        .legend-header { background: #2c3e50; color: white; padding: 10px 15px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; }
        .legend-content { padding: 12px; font-size: 0.9em; }
        .legend-content.collapsed { display: none; }
        .legend-item { display: flex; align-items: center; margin-bottom: 6px; }
        .legend-box { width: 16px; height: 16px; margin-right: 10px; border: 1px solid rgba(0,0,0,0.2); border-radius: 3px; }
        
        .leaflet-popup-content { font-family: 'Segoe UI', sans-serif; line-height: 1.4; min-width: 200px; }
        .species-list { margin-top: 8px; padding: 5px; background: #f4f7f6; border-radius: 4px; border: 1px solid #eee; }
        
        .available { color: #27ae60; font-weight: bold; }
        .unavailable { color: #e74c3c; font-weight: bold; }

        .gmu-label { background: transparent; border: none; box-shadow: none; font-weight: bold; color: #000; font-size: 11px; text-shadow: 1px 1px 2px white; pointer-events: none; }
        .land-label { background: transparent; border: none; box-shadow: none; color: #2c3e50; font-size: 10px; font-style: italic; pointer-events: none; }
        
        .county-label { 
            background: transparent !important; 
            border: none !important; 
            box-shadow: none !important; 
            color: #c0392b !important; 
            font-size: 11px !important; 
            font-weight: 900 !important; 
            text-transform: uppercase; 
            text-shadow: 2px 2px 3px white, -2px -2px 3px white, 2px -2px 3px white, -2px 2px 3px white;
            white-space: nowrap;
            pointer-events: none; 
        }
    </style>
</head>
<body>

<div class="map-title">
    <h2 style="margin:0; color: #2c3e50; font-size: 1.4em;">Colorado Hunting Map</h2>
    <div class="filter-group">
        <label style="font-weight: bold; font-size: 0.8em; color: #7f8c8d;">SEARCH GMU:</label>
        <div class="search-row">
            <input type="text" id="gmu-search-input" placeholder="e.g. 391">
            <button id="search-btn">Go</button>
        </div>
    </div>
    <div class="filter-group">
        <select id="gmu-select"><option value="">-- Select Unit --</option></select>
    </div>
    <div class="download-box">
        <a href="docs/brochure_2026.pdf" target="_blank" class="download-link">
            <span>📄 View 2026 Brochure</span>
        </a>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' });
    var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri' });

    var map = L.map('map', { center: [39.0, -105.5], zoom: 7, layers: [osm] });

    /* CREATE PANES FOR LAYER DEPTH */
    map.createPane('countyPane'); map.getPane('countyPane').style.zIndex = 350;
    map.createPane('migrationPane'); map.getPane('migrationPane').style.zIndex = 375; // UNDER GMU
    map.createPane('gmuPane'); map.getPane('gmuPane').style.zIndex = 400;
    map.createPane('federalPane'); map.getPane('federalPane').style.zIndex = 475;
    map.createPane('swaPane'); map.getPane('swaPane').style.zIndex = 500;
    map.createPane('labelPane'); map.getPane('labelPane').style.zIndex = 650;

    var countyLayer = L.layerGroup(); 
    var migrationLayer = L.layerGroup().addTo(map); // Default On
    var fedLayer = L.layerGroup().addTo(map);
    var gmuLayer = L.layerGroup().addTo(map);
    var swaLayer = L.layerGroup().addTo(map);

    var gmuGeojson, swaGeojson, countyGeojson, fedGeojson, migrationGeojson;
    var currentSelectedLayer = null;
    var locationMarker = null;

    var activeStyle = { color: "#00FFFF", weight: 6, fillOpacity: 0.0 };

    L.control.layers({"Street View": osm, "Satellite View": satellite}, 
                     {
                        "SWAs & Parks": swaLayer, 
                        "GMU Boundaries": gmuLayer,
                        "Elk Migration": migrationLayer,
                        "County": countyLayer,
                        "Federal Lands": fedLayer
                     }, 
                     { collapsed: false }).addTo(map);

    var LocateControl = L.Control.extend({
        options: { position: 'bottomleft' },
        onAdd: function (map) {
            var container = L.DomUtil.create('div', 'custom-control locate-control');
            container.innerHTML = '⌖'; 
            container.onclick = function(e) {
                L.DomEvent.stopPropagation(e);
                map.locate({setView: true, maxZoom: 14});
            };
            return container;
        }
    });
    map.addControl(new LocateControl());

    map.on('locationfound', function(e) {
        if (locationMarker) { map.removeLayer(locationMarker); }
        locationMarker = L.circleMarker(e.latlng, {
            radius: 8, fillColor: "#3498db", color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.8
        }).addTo(map);
    });

    function clearAllHovers() {
        if (gmuGeojson) gmuGeojson.resetStyle();
        if (swaGeojson) swaGeojson.resetStyle();
        if (currentSelectedLayer) {
            currentSelectedLayer.setStyle(activeStyle);
        }
    }

    function setupInteractions(layer, popupContent) {
        layer.bindPopup(popupContent);
        layer.on({
            mouseover: function() { 
                clearAllHovers(); 
                layer.setStyle(activeStyle);
                layer.bringToFront();
            },
            mouseout: function() { clearAllHovers(); },
            click: function(e) { 
                L.DomEvent.stopPropagation(e); 
                currentSelectedLayer = layer; 
                clearAllHovers(); 
                layer.setStyle(activeStyle);
                layer.bringToFront(); 
            }
        });
    }

    function getHuntingPopup(props, title) {
        var speciesData = [
            { name: "Elk", val: props.ELKDAU }, { name: "Deer", val: props.DEERDAU },
            { name: "Pronghorn", val: props.ANTDAU }, { name: "Moose", val: props.MOOSEDAU },
            { name: "Bear", val: props.BEARDAU }, { name: "Lion", val: props.LIONDAU }
        ];
        var speciesHtml = speciesData.map(s => {
            var valStr = s.val ? String(s.val).trim() : "";
            var isAvailable = valStr.length >= 2 && valStr !== "0" && !valStr.includes("99");
            return `<div class="${isAvailable ? 'available' : 'unavailable'}">${isAvailable ? '✓' : '✗'} ${s.name}</div>`;
        }).join('');

        return `<div style="border-bottom: 2px solid #e67e22; margin-bottom: 8px; padding-bottom: 4px;">
                    <b style="font-size: 1.2em; color: #2c3e50;">${title}</b>
                </div><div class="species-list"><div style="display: grid; grid-template-columns: 1fr 1fr; font-size: 0.9em;">${speciesHtml}</div></div>`;
    }

    /* 1. COUNTY DATA */
    fetch('data/processed/county_co_CO.geojson').then(res => res.json()).then(data => {
        countyGeojson = L.geoJSON(data, {
            pane: 'countyPane',
            style: { color: "#e74c3c", weight: 1.5, fillOpacity: 0 },
            onEachFeature: function(f, l) {
                var name = f.properties.COUNTY || f.properties.name || f.properties.NAME || "";
                var cleanName = name.replace(/County/gi, "").trim();
                if (l.getBounds) {
                    var center = l.getBounds().getCenter();
                    L.marker(center, { opacity: 0, interactive: false })
                     .bindTooltip(cleanName, { permanent: true, direction: 'center', className: 'county-label', pane: 'labelPane' })
                     .addTo(countyLayer);
                }
            }
        }).addTo(countyLayer);
    });

    /* 2. ELK MIGRATION - Under GMU, Dark Blue Transparent */
    fetch('data/processed/elk_migration.geojson').then(res => res.json()).then(data => {
        migrationGeojson = L.geoJSON(data, {
            pane: 'migrationPane',
            style: { 
                color: 'transparent', 
                fillColor: "#2c3e50", 
                fillOpacity: 0.4, 
                weight: 0 
            },
            onEachFeature: function(f, l) {
                l.bindPopup("<b>Elk Migration Area</b>");
            }
        }).addTo(migrationLayer);
    });

    /* 3. FEDERAL LANDS */
    function getFedStyle(agency) {
        switch (agency) {
            case 'USFS': return { color: '#27ae60', opacity: 0.4 }; 
            case 'BLM':  return { color: '#e67e22', opacity: 0.4 }; 
            case 'NPS':  return { color: '#9b59b6', opacity: 0.4 }; 
            default:     return { color: 'transparent', opacity: 0 }; 
        }
    }

    fetch('data/processed/surface_management_agency_CO.geojson').then(res => res.json()).then(data => {
        fedGeojson = L.geoJSON(data, {
            pane: 'federalPane',
            interactive: false,
            style: function(f) {
                var s = getFedStyle(f.properties.ADMIN_AGEN);
                return { fillColor: s.color, fillOpacity: s.opacity, weight: 0 };
            }
        }).addTo(fedLayer);
    });

    /* 4. GMU DATA */
    fetch('data/processed/CPW_GMU_Boundary_BigGame_CO.geojson').then(res => res.json()).then(data => {
        gmuGeojson = L.geoJSON(data, {
            pane: 'gmuPane',
            style: { color: "#000", weight: 1, fillOpacity: 0.05 },
            onEachFeature: function(f, l) {
                l.bindTooltip(f.properties.GMUID.toString(), { permanent: true, direction: 'center', className: 'gmu-label' });
                setupInteractions(l, getHuntingPopup(f.properties, "Unit " + f.properties.GMUID));
            }
        }).addTo(gmuLayer);

        var gmuSelect = document.getElementById('gmu-select');
        data.features.sort((a,b) => a.properties.GMUID - b.properties.GMUID).forEach(f => {
            var opt = document.createElement('option'); opt.value = f.properties.GMUID; opt.innerHTML = "Unit " + f.properties.GMUID;
            gmuSelect.appendChild(opt);
        });

        function zoomTo(id) {
            gmuGeojson.eachLayer(l => {
                if(l.feature.properties.GMUID.toString() === id.toString()) {
                    currentSelectedLayer = l; clearAllHovers();
                    map.fitBounds(l.getBounds()); l.openPopup();
                }
            });
        }
        gmuSelect.onchange = (e) => zoomTo(e.target.value);
        document.getElementById('search-btn').onclick = () => zoomTo(document.getElementById('gmu-search-input').value);
    });

    /* 5. SWAs & PARKS */
    fetch('data/processed/CPW_State_Wildlife_Areas_And_State_Parks_CO.geojson').then(res => res.json()).then(data => {
        swaGeojson = L.geoJSON(data, {
            pane: 'swaPane',
            style: function(f) {
                var isPark = f.properties.PropType === "SP";
                return { color: "#333", weight: 0.8, fillColor: isPark ? "#ff0000" : "#ffff00", fillOpacity: 0.7 };
            },
            onEachFeature: function(f, l) {
                l.bindTooltip(f.properties.PropName, { className: 'land-label' });
                setupInteractions(l, `<b>${f.properties.PropName}</b>`);
            }
        }).addTo(swaLayer);
    });

    /* LEGEND */
    var legendWidget = L.control({position: 'bottomright'});
    legendWidget.onAdd = function() {
        var div = L.DomUtil.create('div', 'legend-widget');
        div.innerHTML = `<div class="legend-header" id="legend-toggle">Legend <span>▼</span></div><div class="legend-content" id="legend-body"></div>`;
        return div;
    };
    legendWidget.addTo(map);

    function updateLegend() {
        var body = document.getElementById('legend-body');
        var html = '';
        if (map.hasLayer(gmuLayer)) html += `<div class="legend-item"><div class="legend-box" style="background:rgba(0,0,0,0.1)"></div>GMU Boundaries</div>`;
        if (map.hasLayer(migrationLayer)) html += `<div class="legend-item"><div class="legend-box" style="background:#2c3e50; opacity:0.4; border:none;"></div>Elk Migration</div>`;
        if (map.hasLayer(countyLayer)) html += `<div class="legend-item"><div class="legend-box" style="background:#e74c3c; height:2px; border:none;"></div>County Lines</div>`;
        if (map.hasLayer(fedLayer)) {
            html += `<b style="display:block;margin-top:5px">Federal Agencies</b>
                     <div class="legend-item"><div class="legend-box" style="background:#27ae60"></div>US Forest Service</div>
                     <div class="legend-item"><div class="legend-box" style="background:#e67e22"></div>BLM</div>
                     <div class="legend-item"><div class="legend-box" style="background:#9b59b6"></div>NPS</div>`;
        }
        if (map.hasLayer(swaLayer)) {
            html += `<b style="display:block;margin-top:5px">State Lands</b>
                     <div class="legend-item"><div class="legend-box" style="background:#ffff00"></div>SWA</div>
                     <div class="legend-item"><div class="legend-box" style="background:#ff0000"></div>State Park</div>`;
        }
        body.innerHTML = html || 'No active layers';
    }

    document.getElementById('legend-toggle').onclick = function() {
        document.getElementById('legend-body').classList.toggle('collapsed');
        this.querySelector('span').innerHTML = document.getElementById('legend-body').classList.contains('collapsed') ? '▲' : '▼';
    };

    map.on('overlayadd overlayremove', updateLegend);
    updateLegend();
    map.on('click', function() { currentSelectedLayer = null; clearAllHovers(); });
</script>
</body>
</html>
